<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Key Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 25px; border-radius: 10px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 5px; border: none; box-sizing: border-box; }
        input { background: #2c2c2c; color: #fff; font-size: 14px; }
        button { background: #6200ee; color: #fff; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #7c4dff; }
        label { font-size: 12px; color: #b0bec5; margin-top: 10px; display: block; }
        #keyDisplay { margin-top: 15px; font-family: monospace; font-size: 15px; color: #03dac6; word-break: break-all; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Admin Key Panel</h2>
        
        <label>Admin Secret Password</label>
        <input type="password" id="adminSecret" placeholder="Your Render Admin Secret">

        <label>GitHub Personal Access Token</label>
        <input type="password" id="githubToken" placeholder="ghp_xxxxxxxxxxxx">

        <label>GitHub Username (Owner)</label>
        <input type="text" id="githubOwner" placeholder="Your GitHub Username">

        <label>GitHub Repository Name</label>
        <input type="text" id="githubRepo" placeholder="Your Repo Name">

        <button onclick="generateKey()">Generate New Key</button>
        <div id="keyDisplay"></div>
    </div>

    <script>
        async function generateKey() {
            const secret = document.getElementById('adminSecret').value;
            const token = document.getElementById('githubToken').value;
            const owner = document.getElementById('githubOwner').value;
            const repo = document.getElementById('githubRepo').value;

            if (!secret || !token || !owner || !repo) {
                alert('Please fill in all fields!');
                return;
            }

            const res = await fetch('/api/admin/generate', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${secret}`
                },
                body: JSON.stringify({ token, owner, repo })
            });

            const data = await res.json();
            if (res.ok) {
                document.getElementById('keyDisplay').innerText = "Key: " + data.key;
            } else {
                alert(data.error || 'Failed to generate key');
            }
        }
    </script>
</body>
</html>
